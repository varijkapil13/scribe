name: Scribe

options:
  bundleIdPrefix: com.varij
  # Source language of Localizable.xcstrings. XcodeGen derives knownRegions
  # from this plus the locales found in the string catalog (en, de).
  developmentLanguage: en
  deploymentTarget:
    macOS: "27.0"
    # iOS / iPadOS 27 to match the Mac: the iPhone/iPad app uses the same
    # OS-27-era APIs (SpeechAnalyzer, Foundation Models, Liquid Glass
    # `glassEffect`, the `Tab` / `.sidebarAdaptable` TabView API, iPadOS
    # menu bar commands) without availability checks.
    iOS: "27.0"

targets:
  Scribe:
    type: application
    platform: macOS
    sources:
      - path: Scribe/
        # Editor/ ships as a PRESERVED folder reference (the entry below).
        # This exclude is REQUIRED: without it, `sources: Scribe/` recursively
        # auto-classifies Editor/*.js|html|css as resources and adds them as a
        # FLATTENED group — every chunk lands in Resources/ root (not under
        # Resources/Editor/chunks/), so the ESM bundle's `./chunks/…` imports
        # 404 and the editor renders blank.
        excludes:
          - "Resources/Editor"
          - "Resources/Editor/**"
      # Folder reference (blue folder) added to the resources build phase:
      # preserves the Editor/ subtree — crucially Editor/chunks/ — inside the
      # app bundle, so WebMarkdownEditor resolves index.html via
      # subdirectory:"Editor" and the editor's relative chunk imports resolve.
      #
      # NOTE: xcodegen has NO top-level `resources:` target key — resource
      # folder references MUST be declared here under `sources` with
      # `buildPhase: resources`. (A former `resources:` block here was silently
      # ignored, which is why Editor was only ever bundled flattened by the
      # recursive entry above.)
      - path: Scribe/Resources/Editor
        type: folder
        buildPhase: resources
    dependencies:
      - package: GRDB.swift
        product: GRDB
      - package: KeyboardShortcuts
      - package: swift-markdown
        product: Markdown
      - package: FluidAudio
      # App extensions (Extensions/), embedded into Scribe.app/Contents/PlugIns.
      # Shared App Group model code lives in Scribe/Shared/ (compiled by this
      # target and SwiftPM) and is listed file-by-file in each extension.
      - target: ScribeWidgets
      - target: ScribeQuickLook
      - target: ScribeShare
      # Sparkle 2 auto-updates (Scribe/App/Updater.swift).
      - package: Sparkle
      # The note editor is now the CodeMirror 6 bundle hosted in a WKWebView
      # (WebMarkdownEditor + Scribe/Resources/Editor/). The old native
      # CodeEditSourceEditor engine has been removed, so it is no longer a
      # dependency.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.varij.scribe
        INFOPLIST_FILE: Scribe/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Scribe/Resources/Scribe.entitlements
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: Scribe
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        ARCHS: arm64
        EXCLUDED_ARCHS[sdk=macosx*]: x86_64
        # Stable code signing so macOS TCC remembers granted permissions
        # (Microphone, Speech Recognition, Screen Recording) across rebuilds.
        DEVELOPMENT_TEAM: U8A3QH6Y84
        CODE_SIGN_STYLE: Automatic
        # Hardened Runtime is required for notarization. Sandbox is intentionally
        # off (see Scribe.entitlements), but we still enable Hardened Runtime so
        # notarytool accepts the build.
        ENABLE_HARDENED_RUNTIME: "YES"
        # Disable JIT / executable memory pages by default; nothing in Scribe
        # needs them, and removing them shrinks the attack surface.
        OTHER_CODE_SIGN_FLAGS: "--options=runtime"
        # The diarizer-model copy script below reads build-resources/, which
        # Xcode's user-script sandbox would block.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # Brand accent from Assets.xcassets/AccentColor (used when the user's
        # system accent is Multicolor; a user-chosen accent always wins).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Localization: String Catalog (Scribe/Resources/Localizable.xcstrings)
        # with compiler-extracted keys.
        LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        # Sparkle EdDSA public key, expanded into Info.plist SUPublicEDKey.
        # Empty (the default) disables the updater gracefully; the release
        # workflow passes the real key on the xcodebuild command line.
        SPARKLE_PUBLIC_ED_KEY: ""
    postBuildScripts:
      # Bundle the speaker-diarization models when they've been fetched
      # (scripts/fetch-diarizer-models.sh; release builds always do). Without
      # them the app downloads the model on first use if the user allows it.
      - name: Bundle speaker-diarization models
        basedOnDependencyAnalysis: false
        script: |
          SRC="$SRCROOT/build-resources/DiarizerModels"
          if [ -d "$SRC/speaker-diarization-coreml" ]; then
            DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/DiarizerModels"
            rm -rf "$DEST"
            mkdir -p "$DEST"
            cp -R "$SRC/speaker-diarization-coreml" "$DEST/"
            echo "Bundled diarizer models into $DEST"
          else
            echo "Diarizer models not fetched; app will download on first use."
          fi
  # App extensions. They live OUTSIDE Scribe/ because `swift test` compiles
  # every file under Scribe/ into the app's SwiftPM executable target, and
  # extension code (WidgetKit bundle @main, QLPreviewingController, share
  # view controller) must not be part of it. Each one is sandboxed and shares
  # the App Group group.com.varij.scribe with the app (see ScribeAppGroup).
  ScribeWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/ScribeWidgets
      - path: Scribe/Shared/ScribeAppGroup.swift
      - path: Scribe/Shared/SharedSnapshot.swift
      - path: Scribe/Shared/ScribeWidgetTaskRequest.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.varij.scribe.widgets
        INFOPLIST_FILE: Extensions/ScribeWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/ScribeWidgets/ScribeWidgets.entitlements
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        ARCHS: arm64
        EXCLUDED_ARCHS[sdk=macosx*]: x86_64
        DEVELOPMENT_TEAM: U8A3QH6Y84
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: "YES"
        SKIP_INSTALL: "YES"
  ScribeQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/ScribeQuickLook
      - path: Scribe/Shared/ScribeMarkdownPreviewParser.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.varij.scribe.quicklook
        INFOPLIST_FILE: Extensions/ScribeQuickLook/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/ScribeQuickLook/ScribeQuickLook.entitlements
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        ARCHS: arm64
        EXCLUDED_ARCHS[sdk=macosx*]: x86_64
        DEVELOPMENT_TEAM: U8A3QH6Y84
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: "YES"
        SKIP_INSTALL: "YES"
  ScribeShare:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/ScribeShare
      - path: Scribe/Shared/ScribeAppGroup.swift
      - path: Scribe/Shared/ScribeSharePayload.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.varij.scribe.share
        INFOPLIST_FILE: Extensions/ScribeShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/ScribeShare/ScribeShare.entitlements
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        ARCHS: arm64
        EXCLUDED_ARCHS[sdk=macosx*]: x86_64
        DEVELOPMENT_TEAM: U8A3QH6Y84
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: "YES"
        SKIP_INSTALL: "YES"
  # XCUITest target. Drives the built Scribe app through the accessibility
  # tree. The app is launched with `--uitesting` (see AppLaunchEnvironment) so
  # it boots without the audio / ScreenCaptureKit capture stack.
  ScribeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ScribeUITests/
    dependencies:
      - target: Scribe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.varij.scribe.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        ARCHS: arm64
        EXCLUDED_ARCHS[sdk=macosx*]: x86_64
        DEVELOPMENT_TEAM: U8A3QH6Y84
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: Scribe
  # iOS / iPadOS app target. The notes + tasks client (no recording — that's
  # macOS-only). Compiles the portable core directly (multiplatform target, not
  # a separate ScribeCore package — see docs/ICLOUD-MULTIPLATFORM-DESIGN.md):
  # Storage, Tasks, the meeting/entity data models, and shared logging. The two
  # FSEvents-bound vault files (NoteVaultWatcher, VaultCoordinator) are excluded
  # — they're macOS-only and nothing else in Storage references them in code.
  ScribeiOS:
    type: application
    platform: iOS
    sources:
      - path: ScribeiOS/
        excludes:
          - Info.plist   # generated by the `info:` block below (INFOPLIST_FILE)
      - path: Scribe/Storage
        excludes:
          - NoteVaultWatcher.swift   # CoreServices / FSEvents — macOS only
          - VaultCoordinator.swift   # owns the watcher; imports SwiftUI chrome
      - path: Scribe/Tasks            # RecurrenceRule/Engine, QuickAddParser, reminders — all portable
      - path: Scribe/Sync             # CloudKit task sync (merge policy, record mapping, service)
      - path: Scribe/UI/Tasks/ActionItemConverter.swift   # pure logic: ActionItem→Task + NSDataDetector.scribeDateDetector (QuickAddParser needs it)
      - path: Scribe/Utilities/Log.swift
      - path: Scribe/Intelligence/MeetingModels.swift
      - path: Scribe/Intelligence/TranscriptAnalyzer.swift   # ExtractedEntity + NaturalLanguage (iOS-ok)
      - path: Scribe/App/AppLaunchEnvironment.swift
      # ios-shell: entry points + navigation model (all Foundation-only /
      # portable; ScribeUserActivity gates its macOS MainSelection mapping).
      - path: Scribe/App/DeepLink.swift
      - path: Scribe/App/ScribeUserActivity.swift
      - path: Scribe/App/NotificationRouter.swift
      - path: Scribe/App/ScribeMobileRouting.swift
      - path: Scribe/App/ScribeMobileSearch.swift
      # --- ios-notes (wave 5): the shared CodeMirror editor + notes browser ---
      # The CodeMirror bundle, as the same preserved folder reference the macOS
      # target uses (chunks/ must keep its subtree — see the Scribe target).
      - path: Scribe/Resources/Editor
        type: folder
        buildPhase: resources
      # Portable editor host core + bridge types (AppKit bits are #if os(macOS)).
      - path: Scribe/UI/Notes/WebEditorCore.swift
      - path: Scribe/UI/Notes/WebEditorBridge.swift
      - path: Scribe/UI/Notes/EditorCommandBridge.swift
      - path: Scribe/UI/Notes/EditorAttachmentFiles.swift
      - path: Scribe/UI/Notes/PowerNotes/NoteEmbedContentProvider.swift
      - path: Scribe/UI/Notes/PowerNotes/NotePowerEditorCommands.swift
      - path: Scribe/UI/Notes/Portable   # pure list / link / capture-naming logic
      - path: Scribe/Utilities/PlantUMLRenderingPreference.swift
      # --- end ios-notes ---
      # ios-tasks: the Mac's pure board / planner / calendar-event logic, shared
      # (not duplicated) by ScribeiOS/Tasks. All Foundation-only.
      - path: Scribe/UI/Tasks/Board/TaskBoardModel.swift
      - path: Scribe/UI/Tasks/Planner/TimeGridLayout.swift
      - path: Scribe/UI/Tasks/Planner/PlannerScheduling.swift
      - path: Scribe/UI/Tasks/Planner/PlannerMirroredEventFilter.swift
      - path: Scribe/Calendar/CalendarEventMatcher.swift
      - path: Scribe/Calendar/TaskCalendarMirrorPlanner.swift
    dependencies:
      - package: GRDB.swift
        product: GRDB
    # ios-shell: Info.plist keys with no INFOPLIST_KEY_* build setting.
    # Xcode merges this file with the generated keys (GENERATE_INFOPLIST_FILE).
    # Other areas: append your keys under `properties:` with an area comment.
    info:
      path: ScribeiOS/Info.plist
      properties:
        # scribe:// deep links (ScribeDeepLink → ScribeMobileRoute).
        CFBundleURLTypes:
          - CFBundleURLName: com.varij.scribe
            CFBundleURLSchemes:
              - scribe
        # Handoff with the Mac + iPad note-window drags
        # (ScribeMobileWindows.continuedActivityTypes).
        NSUserActivityTypes:
          - com.varij.scribe.viewNote
          - com.varij.scribe.viewTask
          - com.varij.scribe.openNoteWindow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.varij.scribe
        PRODUCT_NAME: Scribe
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        # Universal: iPhone (1) + iPad (2).
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: U8A3QH6Y84
        CODE_SIGN_STYLE: Automatic
        # ios-shell: iPad multiple windows (Stage Manager, Split View, note
        # windows), every orientation (required for iPad multitasking;
        # iPhone landscape too), and pointer / trackpad events.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # ios-notes (wave 5): camera attachments + Face ID for locked notes.
        INFOPLIST_KEY_NSCameraUsageDescription: "Scribe uses the camera to add photos and scanned documents to your notes."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Scribe uses Face ID to unlock your locked notes."
        # ios-tasks: Apple Reminders two-way sync + calendar events in Today /
        # the day planner. Access is only requested when the user turns these
        # on under Settings → Tasks.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Scribe keeps your tasks and Apple Reminders in sync when you turn on Reminders sync."
        INFOPLIST_KEY_NSRemindersUsageDescription: "Scribe keeps your tasks and Apple Reminders in sync when you turn on Reminders sync."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Scribe shows today's events next to your tasks in Today and the day planner."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Scribe shows today's events next to your tasks in Today and the day planner."

schemes:
  Scribe:
    build:
      targets:
        Scribe: all
        ScribeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScribeUITests
    archive:
      config: Release
  ScribeiOS:
    build:
      targets:
        ScribeiOS: all
    run:
      config: Debug
    archive:
      config: Release

# NOTE: Logic-only unit tests live in `ScribeTests/` and are run via
# `swift test` against the SwiftPM package (see Package.swift). Hosting them
# inside Xcode's test scheme proved fragile because the host app boots
# audio/recording services during launch; SwiftPM's logic-only test bundle
# avoids the issue. The `ScribeUITests/` XCUITest target above launches the
# app out-of-process with `--uitesting`, which gates that boot — so it can
# live in the Xcode test scheme without the same crash.

packages:
  GRDB.swift:
    url: https://github.com/groue/GRDB.swift
    from: "6.24.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  swift-markdown:
    url: https://github.com/apple/swift-markdown.git
    from: "0.6.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: "0.17.7"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
