name: Release macOS

# Build the shippable macOS app and publish it as a downloadable GitHub Release
# whenever a version tag (v*) is pushed. Also runnable manually
# (workflow_dispatch): with a `version` input it creates tag v<version> and the
# Release from the chosen commit; without one it only builds + uploads a
# workflow artifact.
#
# NOTE ON SIGNING: the app is always built ad-hoc signed (CODE_SIGN_IDENTITY="-").
# When Developer ID secrets are configured it is then re-signed with Developer
# ID + Hardened Runtime (scripts/codesign-developer-id.sh), notarized
# (scripts/notarize.sh), stapled and checked with spctl; without them the
# release stays ad-hoc signed and NOT notarized, exactly as before:
#   MACOS_CERTIFICATE_P12       base64 of the "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD  its export password
#   APPLE_TEAM_ID               team ID (picks the identity; Apple-ID notarization)
#   NOTARY_API_KEY, NOTARY_API_KEY_ID, NOTARY_API_ISSUER_ID   (preferred), or
#   APPLE_ID, APPLE_APP_PASSWORD                              (app-specific password)
#
# SPARKLE UPDATES: with a SPARKLE_PRIVATE_KEY secret (EdDSA private key from
# Sparkle's generate_keys), the release .zip is signed with sign_update and an
# appcast.xml is attached to the Release (the app's SUFeedURL reads
# releases/latest/download/appcast.xml). The matching public key goes in the
# SPARKLE_PUBLIC_ED_KEY repository variable (or secret); it is compiled into
# Info.plist SUPublicEDKey. Without it the app's updater stays disabled.
#
# Secrets are only ever mapped into step `env:`; `if:` conditions read the
# outputs of the "Detect signing + update secrets" step.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (creates tag v<version> on this commit). Leave empty for a build-only run."
        required: false
        default: ""

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create the Release and upload assets

jobs:
  release:
    name: build + package macOS app
    runs-on: xcode-27
    env:
      # The release tag: the pushed tag, or v<version> from a manual run. Empty
      # means build + upload a workflow artifact only, no GitHub Release.
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.version != '' && format('v{0}', inputs.version) || '') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, so the changelog step can diff against the previous tag

      - name: Select Xcode 27
        # macOS 27 SDK is required (deployment target 27.0). Pick the newest
        # installed Xcode 27 and fail loudly if the runner image has none.
        run: |
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::No Xcode 27 on this runner image"; exit 1; fi
          sudo xcode-select -switch "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Stamp version from the tag
        # CFBundleShortVersionString = the tag without its leading "v";
        # CFBundleVersion = the run number (monotonic, required to increase for
        # notarized uploads). So the shipped app's version always matches the
        # release tag — no manual Info.plist bump. The committed Info.plist keeps
        # its dev placeholder; this only stamps the CI artifact. (manual_dispatch
        # runs without a tag keep the committed version.)
        if: env.RELEASE_TAG != ''
        run: |
          VERSION="${RELEASE_TAG#v}"
          PLIST="Scribe/Resources/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$PLIST"
          echo "Stamped $PLIST -> ${VERSION} (build ${GITHUB_RUN_NUMBER})"

      - name: Fetch speaker-diarization models
        run: scripts/fetch-diarizer-models.sh

      - name: Build app (Release, ad-hoc signed)
        # Manual ad-hoc signing ("-") with no team/profile: xcodebuild signs the
        # app + nested frameworks and embeds the entitlements during the build,
        # so the result actually runs. CODE_SIGNING_REQUIRED=NO keeps a signing
        # hiccup from failing the build. SPARKLE_PUBLIC_ED_KEY (empty when
        # unset) becomes Info.plist SUPublicEDKey.
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY || secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          xcodebuild \
            -project Scribe.xcodeproj \
            -scheme Scribe \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/dd \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SPARKLE_PUBLIC_ED_KEY="${SPARKLE_PUBLIC_ED_KEY:-}" \
            build

      - name: Detect signing + update secrets
        # Maps secrets into env and reports which optional stages can run.
        # Every later signing / notarization / Sparkle step keys off these
        # outputs, so an unconfigured repo keeps the plain ad-hoc flow.
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY || secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          developer_id=false
          notarize=false
          sparkle=false
          if [ -n "${MACOS_CERTIFICATE_P12:-}" ] && [ -n "${MACOS_CERTIFICATE_PASSWORD:-}" ]; then
            developer_id=true
            if [ -n "${NOTARY_API_KEY:-}" ] && [ -n "${NOTARY_API_KEY_ID:-}" ] && [ -n "${NOTARY_API_ISSUER_ID:-}" ]; then
              notarize=true
            elif [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
              notarize=true
            else
              echo "::warning::Developer ID certificate found but no notarization credentials; the app will be signed but not notarized"
            fi
          else
            echo "::notice::No Developer ID secrets; building an ad-hoc signed, non-notarized release"
          fi
          if [ -n "${SPARKLE_PRIVATE_KEY:-}" ]; then
            sparkle=true
            if [ -z "${SPARKLE_PUBLIC_ED_KEY:-}" ]; then
              echo "::warning::SPARKLE_PRIVATE_KEY is set but SPARKLE_PUBLIC_ED_KEY is not; this build's updater is disabled"
            fi
          else
            echo "::notice::No SPARKLE_PRIVATE_KEY; skipping update signing + appcast"
          fi
          {
            echo "developer_id=${developer_id}"
            echo "notarize=${notarize}"
            echo "sparkle=${sparkle}"
          } >> "$GITHUB_OUTPUT"
          echo "developer_id=${developer_id} notarize=${notarize} sparkle=${sparkle}"

      - name: Sign app with Developer ID
        # Temporary keychain (removed in the last step), then inside-out
        # re-signing with Hardened Runtime + secure timestamp + entitlements.
        if: steps.signing.outputs.developer_id == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="build/dd/Build/Products/Release/Scribe.app"
          KEYCHAIN="$RUNNER_TEMP/scribe-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="$RUNNER_TEMP/scribe-developer-id.p12"

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Put the temporary keychain first in the search list (codesign
          # needs it there to build the certificate chain).
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' || true)"
          if [ -n "${APPLE_TEAM_ID:-}" ]; then
            IDENTITIES="$(printf '%s\n' "$IDENTITIES" | grep "(${APPLE_TEAM_ID})" || true)"
          fi
          IDENTITY="$(printf '%s\n' "$IDENTITIES" | head -1 | awk '{print $2}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 holds no usable 'Developer ID Application' identity"
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          scripts/codesign-developer-id.sh "$APP" "$IDENTITY" Scribe/Resources/Scribe.entitlements "$KEYCHAIN"

      - name: Notarize + staple app
        if: steps.signing.outputs.notarize == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="build/dd/Build/Products/Release/Scribe.app"
          SUBMISSION="$RUNNER_TEMP/Scribe-notarize.zip"
          ditto -c -k --keepParent "$APP" "$SUBMISSION"
          scripts/notarize.sh "$SUBMISSION"
          rm -f "$SUBMISSION"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Package app (.zip + .dmg)
        id: package
        run: |
          set -euo pipefail
          APP="build/dd/Build/Products/Release/Scribe.app"
          [ -d "$APP" ] || { echo "::error::Scribe.app not found at $APP"; exit 1; }

          # Prefer the pushed tag for naming; fall back to the bundle version.
          if [ -n "${RELEASE_TAG}" ]; then
            NAME="${RELEASE_TAG}"
          else
            NAME="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          fi
          mkdir -p dist

          ditto -c -k --keepParent "$APP" "dist/Scribe-${NAME}.zip"

          STAGE="build/dmg-stage"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Scribe ${NAME}" -srcfolder "$STAGE" -ov -format UDZO "dist/Scribe-${NAME}.dmg"

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Sign + notarize DMG
        # The app inside is already signed (and stapled when notarized); this
        # signs the disk image itself so Gatekeeper accepts the download.
        if: steps.signing.outputs.developer_id == 'true'
        env:
          NOTARIZE: ${{ steps.signing.outputs.notarize }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="dist/Scribe-${{ steps.package.outputs.name }}.dmg"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" "$DMG"
          if [ "$NOTARIZE" = "true" ]; then
            scripts/notarize.sh "$DMG"
            xcrun stapler staple "$DMG"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          fi

      - name: Sign update + generate appcast (Sparkle)
        # sign_update from the Sparkle release matching the linked package
        # (Package.resolved), falling back to a pinned version. The appcast
        # has one item — the feed URL always serves the latest release's copy.
        if: steps.signing.outputs.sparkle == 'true' && env.RELEASE_TAG != ''
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_FALLBACK_VERSION: "2.6.4"
        run: |
          set -euo pipefail
          APP="build/dd/Build/Products/Release/Scribe.app"
          ZIP="dist/Scribe-${RELEASE_TAG}.zip"
          [ -f "$ZIP" ] || { echo "::error::$ZIP not found"; exit 1; }

          RESOLVED="Scribe.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          SPARKLE_VERSION=""
          if [ -f "$RESOLVED" ]; then
            SPARKLE_VERSION="$(python3 -c 'import json,sys
          data = json.load(open(sys.argv[1]))
          pins = data.get("pins") or data.get("object", {}).get("pins", [])
          for pin in pins:
              name = (pin.get("identity") or pin.get("package") or "").lower()
              if name == "sparkle":
                  print(pin.get("state", {}).get("version") or "")
                  break' "$RESOLVED" || true)"
          fi
          SPARKLE_VERSION="${SPARKLE_VERSION:-$SPARKLE_FALLBACK_VERSION}"
          echo "Using Sparkle tools ${SPARKLE_VERSION}"

          TOOLS="$RUNNER_TEMP/sparkle-tools"
          rm -rf "$TOOLS"; mkdir -p "$TOOLS"
          curl -fsSL -o "$TOOLS/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          tar -xJf "$TOOLS/sparkle.tar.xz" -C "$TOOLS"
          SIGN_UPDATE="$TOOLS/bin/sign_update"
          [ -x "$SIGN_UPDATE" ] || { echo "::error::sign_update not found in the Sparkle ${SPARKLE_VERSION} tools"; exit 1; }

          # Prints: sparkle:edSignature="…" length="…"
          SIGNATURE_ATTRS="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - "$ZIP")"
          case "$SIGNATURE_ATTRS" in
            *edSignature=*) ;;
            *) echo "::error::sign_update produced no signature"; exit 1 ;;
          esac

          SHORT_VERSION="${RELEASE_TAG#v}"
          BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Contents/Info.plist")"
          MIN_SYSTEM="$(/usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' "$APP/Contents/Info.plist")"
          PUB_DATE="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          ZIP_URL="${REPO_URL}/releases/download/${RELEASE_TAG}/$(basename "$ZIP")"

          cat > dist/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Scribe</title>
              <link>${REPO_URL}</link>
              <description>Scribe releases</description>
              <language>en</language>
              <item>
                <title>Scribe ${SHORT_VERSION}</title>
                <pubDate>${PUB_DATE}</pubDate>
                <sparkle:version>${BUILD_VERSION}</sparkle:version>
                <sparkle:shortVersionString>${SHORT_VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>${MIN_SYSTEM}</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>${REPO_URL}/releases/tag/${RELEASE_TAG}</sparkle:fullReleaseNotesLink>
                <enclosure url="${ZIP_URL}" type="application/octet-stream" ${SIGNATURE_ATTRS} />
              </item>
            </channel>
          </rss>
          EOF
          cat dist/appcast.xml

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scribe-macOS-${{ steps.package.outputs.name }}
          path: dist/*
          if-no-files-found: error

      - name: Generate changelog + publish GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZED: ${{ steps.signing.outputs.notarize }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          NOTES="dist/RELEASE_NOTES.md"

          # Download / Gatekeeper blurb.
          if [ "${NOTARIZED:-false}" = "true" ]; then
            cat > "$NOTES" <<'EOF'
          > Signed with a Developer ID and notarized by Apple.

          EOF
          else
            cat > "$NOTES" <<'EOF'
          > **Not notarized.** Built and ad-hoc signed by CI (no Apple Developer ID
          > signature). On first launch macOS Gatekeeper will warn — right-click the
          > app and choose **Open**, or run:
          >
          > ```sh
          > xattr -dr com.apple.quarantine /Applications/Scribe.app
          > ```

          EOF
          fi

          cat >> "$NOTES" <<'EOF'
          Apple Silicon, macOS 27+. Install with Homebrew:

          ```sh
          brew install --cask varijkapil13/tap/scribe
          ```

          or download the `.dmg` (drag to Applications) or the `.zip` below.

          EOF

          # Changelog from conventional commits since the previous v* tag.
          # HEAD is the release commit (the pushed tag, or the dispatched commit
          # whose tag gh creates below), so look for the previous tag before it.
          PREV="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          RANGE="${PREV:+${PREV}..}HEAD"
          section () { # $1 = subject ERE, $2 = heading
            local items
            items="$(git log "$RANGE" --no-merges --pretty='%s' \
                     | grep -E "$1" \
                     | sed -E 's/^[a-z]+(\([^)]+\))?!?: //; s/ \(#[0-9]+\)$//' \
                     | sed 's/^/- /' || true)"
            # An empty section must not end the function non-zero (set -e).
            if [ -n "$items" ]; then
              printf '### %s\n%s\n\n' "$2" "$items" >> "$NOTES"
            fi
          }
          echo "## What's changed" >> "$NOTES"
          if [ -n "$PREV" ]; then
            printf '_Since %s._\n\n' "$PREV" >> "$NOTES"
            section '^feat(\(|!|:)'                  '✨ Features'
            section '^fix(\(|!|:)'                   '🐛 Fixes'
            section '^perf(\(|!|:)'                  '⚡ Performance'
            section '^(refactor|build|docs)(\(|!|:)' '🔧 Maintenance'
          else
            printf '_Initial release — see the README for the full feature set._\n\n' >> "$NOTES"
          fi

          # --target creates the tag on this commit for manual runs; for a pushed
          # tag it already exists and points here.
          gh release create "${TAG}" \
            dist/Scribe-*.dmg dist/Scribe-*.zip \
            --target "${GITHUB_SHA}" \
            --title "Scribe ${TAG}" \
            --notes-file "$NOTES"

      - name: Upload appcast (Sparkle)
        if: env.RELEASE_TAG != '' && steps.signing.outputs.sparkle == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f dist/appcast.xml ]; then
            gh release upload "${RELEASE_TAG}" dist/appcast.xml --clobber
          else
            echo "::warning::dist/appcast.xml missing; the in-app updater won't see this release"
          fi

      - name: Update Homebrew cask (varijkapil13/homebrew-tap)
        # Runs after the GitHub Release exists, so the cask never points at a
        # missing download. Needs a HOMEBREW_TAP_TOKEN secret (a fine-grained
        # token with Contents: read & write on varijkapil13/homebrew-tap, the
        # same one saral uses). Without it the release still succeeds and this
        # step only leaves a notice.
        if: env.RELEASE_TAG != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: varijkapil13/homebrew-tap
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is unset; release published without updating the Homebrew cask"
            exit 0
          fi
          VERSION="${RELEASE_TAG#v}"
          ZIP="dist/Scribe-${RELEASE_TAG}.zip"
          SHA256="$(shasum -a 256 "$ZIP" | cut -d' ' -f1)"

          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP}.git" tap
          mkdir -p tap/Casks
          packaging/homebrew/render-cask.sh "$VERSION" "$SHA256" > tap/Casks/scribe.rb
          cd tap
          if git diff --quiet -- Casks/scribe.rb && git ls-files --error-unmatch Casks/scribe.rb >/dev/null 2>&1; then
            echo "Cask already at ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/scribe.rb
          git commit -m "scribe ${VERSION}"
          git push origin HEAD
          echo "::notice::Homebrew cask updated to ${VERSION}"

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "${KEYCHAIN_PATH}" ]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi
